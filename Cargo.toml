[package]
name = "nameguard"
version = "1.3.0"
edition = "2021"
publish = false
license = "MIT"

[[bin]]
name = "nameguard"
path = "Sources/Rust/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
notify = "8.2"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
plist = "1.7"
time = { version = "0.3", features = ["formatting", "parsing"] }
objc = "0.2.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
