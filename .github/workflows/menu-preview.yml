name: NameGuard screenshots
on:
  push:
    branches: [screenshots-1-2-1]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Capture NameGuard 1.2.1 native AppKit scenes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/preview/screens .build/preview/NameGuard.app/Contents/MacOS
          python3 - <<'PY'
          import pathlib, json, unicodedata
          source = pathlib.Path("Sources/NameGuardMenu/MenuApp.swift").read_text()
          source = source.replace('LoginStartup(executable: executable, directory: directory)', 'LoginStartup(executable: executable, directory: directory, home: "/tmp/NameGuard Preview")', 1)
          source = source.replace("        updateMenu()\n        perform", "        updateMenu()\n        scheduleCapture()\n        perform", 1)
          source = source.replace("try self.login.ensureRegistered()", "try self.login.setEnabled(true)", 1)
          source = source.replace("        return alert.runModal()", '        if ProcessInfo.processInfo.environment["NAMEGUARD_CAPTURE_SCREEN"] == "04-update-check" {\n            print("Actual update dialog: \\(text) | \\(detail)")\n            captureScreen("04-update-check", cropped: false)\n        }\n        return alert.runModal()', 1)
          source += r'''
          extension MenuApp {
              func scheduleCapture() {
                  let name = ProcessInfo.processInfo.environment["NAMEGUARD_CAPTURE_SCREEN"] ?? "01-watching"
                  DispatchQueue.main.asyncAfter(deadline: .now() + 8) {
                      if name == "02-paused" {
                          self.togglePause()
                          DispatchQueue.main.asyncAfter(deadline: .now() + 3) { self.captureMenu(name) }
                      } else if name == "03-folder-picker" {
                          self.addFolder()
                          self.captureScreen(name, cropped: false)
                      } else if name == "04-update-check" {
                          self.checkUpdate()
                      } else { self.captureMenu(name) }
                  }
              }
              func captureMenu(_ name: String) {
                  print("Actual status: \(self.snapshot.title), processed: \(self.snapshot.renamed), login enabled: \(self.loginEnabled)")
                  self.captureScreen(name, cropped: true)
                  if let menu = self.item.menu { self.item.popUpMenu(menu) }
              }
              func captureScreen(_ name: String, cropped: Bool) {
                  let width = NSScreen.main?.frame.width ?? 1024
                  let region = String(format: "%.0f,0,450,490", width - 450)
                  DispatchQueue.global().asyncAfter(deadline: .now() + 2) {
                      let capture = Process()
                      capture.executableURL = URL(fileURLWithPath: "/usr/sbin/screencapture")
                      capture.arguments = ["-x", "-t", "png"]
                      if cropped { capture.arguments! += ["-R", region] }
                      capture.arguments!.append(FileManager.default.currentDirectoryPath + "/.build/preview/screens/" + name + ".png")
                      do {
                          try capture.run()
                          capture.waitUntilExit()
                          print("Screenshot \(name): exit \(capture.terminationStatus)")
                          exit(capture.terminationStatus)
                      } catch { print("Screenshot failed: \(error)"); exit(1) }
                  }
              }
          }
          '''
          pathlib.Path(".build/preview/MenuApp.swift").write_text(source)
          update = pathlib.Path("Sources/NameGuardMenu/UpdateService.swift").read_text()
          update = update.replace('        let (data, response) = try await URLSession.shared.data(for: request)', '        if let token = ProcessInfo.processInfo.environment["GH_TOKEN"] { request.setValue("Bearer " + token, forHTTPHeaderField: "Authorization") }\n        let (data, response) = try await URLSession.shared.data(for: request)', 1)
          pathlib.Path(".build/preview/UpdateService.swift").write_text(update)
          fixture = pathlib.Path("/tmp/NameGuard Preview")
          folder = fixture / "Desktop"
          folder.mkdir(parents=True, exist_ok=True)
          (folder / unicodedata.normalize("NFD", "\uD55C\uAE00\uBB38\uC11C.txt")).write_text("Temporary screenshot fixture only")
          config = {"roots": [str(folder)], "quietSeconds": 1, "directoryQuietSeconds": 2, "excludedPaths": [], "protectedApps": []}
          state = fixture / "Library/Application Support/NameGuard"
          state.mkdir(parents=True, exist_ok=True)
          (state / "config.json").write_text(json.dumps(config))
          PY
          xcrun swiftc -sdk "$(xcrun --sdk macosx --show-sdk-path)" Sources/NameGuard/Core.swift Sources/NameGuard/Watcher.swift Sources/NameGuardMenu/MenuState.swift Sources/NameGuardMenu/MenuSession.swift Sources/NameGuardMenu/AppServices.swift .build/preview/UpdateService.swift .build/preview/MenuApp.swift Sources/NameGuardCLI/main.swift -o .build/preview/NameGuard.app/Contents/MacOS/nameguard
          cp app-info.plist .build/preview/NameGuard.app/Contents/Info.plist
          codesign --force --sign - .build/preview/NameGuard.app
          python3 - <<'PY'
          import subprocess, pathlib, os, time, json
          binary = pathlib.Path(".build/preview/NameGuard.app/Contents/MacOS/nameguard").resolve()
          state = pathlib.Path("/tmp/NameGuard Preview/Library/Application Support/NameGuard")
          for name in ["01-watching", "02-paused", "03-folder-picker", "04-update-check"]:
              (state / "menu.json").write_text(json.dumps({"paused": False}))
              env = dict(os.environ, NAMEGUARD_CAPTURE_SCREEN=name)
              app = subprocess.Popen([str(binary), "--menu", "--state-dir", str(state)], env=env)
              try:
                  code = app.wait(timeout=45)
                  assert code == 0, (name, code)
              except subprocess.TimeoutExpired:
                  app.kill()
                  app.wait(timeout=5)
                  raise
              time.sleep(3)
          screens = sorted(pathlib.Path(".build/preview/screens").glob("*.png"))
          print("Captured files:", [p.name for p in screens])
          assert len(screens) == 4, "GUI capture unavailable in this hosted macOS session"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NameGuard-1.2.1-screenshots
          path: .build/preview/screens/*.png
          if-no-files-found: warn
          retention-days: 7
