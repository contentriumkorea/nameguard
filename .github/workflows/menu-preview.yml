name: NameGuard screenshots
on:
  push:
    branches: [preview-screenshots]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture the actual AppKit menu and folder picker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/preview/screens .build/preview/NameGuard.app/Contents/MacOS
          python3 - <<'PY'
          import pathlib, json, unicodedata
          source = pathlib.Path("Sources/NameGuardMenu/MenuApp.swift").read_text()
          source = source.replace("        updateMenu()\n        perform", "        updateMenu()\n        scheduleCapture()\n        perform", 1)
          source += r'''
          extension MenuApp {
              func scheduleCapture() {
                  let name = ProcessInfo.processInfo.environment["NAMEGUARD_CAPTURE_SCREEN"] ?? "01-watching"
                  DispatchQueue.main.asyncAfter(deadline: .now() + 8) {
                      if name == "02-paused" {
                          self.togglePause()
                          DispatchQueue.main.asyncAfter(deadline: .now() + 3) { self.captureMenu(name) }
                      } else if name == "03-folder-picker" {
                          self.addFolder()
                          self.captureScreen(name, cropped: false)
                      } else { self.captureMenu(name) }
                  }
              }
              func captureMenu(_ name: String) {
                  print("Preview actual status: \(self.snapshot.title), processed: \(self.snapshot.renamed)")
                  self.captureScreen(name, cropped: true)
                  if let menu = self.item.menu { self.item.popUpMenu(menu) }
              }
              func captureScreen(_ name: String, cropped: Bool) {
                  let width = NSScreen.main?.frame.width ?? 1024
                  let region = String(format: "%.0f,0,340,360", width - 340)
                  DispatchQueue.global().asyncAfter(deadline: .now() + 1.5) {
                      let capture = Process()
                      capture.executableURL = URL(fileURLWithPath: "/usr/sbin/screencapture")
                      capture.arguments = ["-x", "-t", "png"]
                      if cropped { capture.arguments! += ["-R", region] }
                      capture.arguments!.append(FileManager.default.currentDirectoryPath + "/.build/preview/screens/" + name + ".png")
                      do {
                          try capture.run()
                          capture.waitUntilExit()
                          print("Screenshot \(name): exit \(capture.terminationStatus)")
                          exit(capture.terminationStatus)
                      } catch { print("Screenshot failed: \(error)"); exit(1) }
                  }
              }
          }
          '''
          pathlib.Path(".build/preview/MenuApp.swift").write_text(source)
          fixture = pathlib.Path("/tmp/NameGuard Preview")
          folder = fixture / "Desktop"
          folder.mkdir(parents=True, exist_ok=True)
          (folder / unicodedata.normalize("NFD", "한글문서.txt")).write_text("Temporary screenshot fixture only")
          config = {"roots": [str(folder)], "quietSeconds": 1, "directoryQuietSeconds": 2, "excludedPaths": [], "protectedApps": []}
          (fixture / "config.json").write_text(json.dumps(config))
          PY
          xcrun swiftc -sdk "$(xcrun --sdk macosx --show-sdk-path)" Sources/NameGuard/Core.swift Sources/NameGuard/Watcher.swift Sources/NameGuardMenu/MenuState.swift Sources/NameGuardMenu/MenuSession.swift .build/preview/MenuApp.swift Sources/NameGuardCLI/main.swift -o .build/preview/NameGuard.app/Contents/MacOS/nameguard
          cp app-info.plist .build/preview/NameGuard.app/Contents/Info.plist
          codesign --force --sign - .build/preview/NameGuard.app
          python3 - <<'PY'
          import subprocess, pathlib, os, time
          binary = pathlib.Path(".build/preview/NameGuard.app/Contents/MacOS/nameguard").resolve()
          for name in ["01-watching", "02-paused", "03-folder-picker"]:
              env = dict(os.environ, NAMEGUARD_CAPTURE_SCREEN=name)
              app = subprocess.Popen([str(binary), "--menu", "--config", "/tmp/NameGuard Preview/config.json", "--state-dir", "/tmp/NameGuard Preview/state"], env=env)
              try:
                  app.wait(timeout=35)
              except subprocess.TimeoutExpired:
                  app.kill()
                  app.wait(timeout=5)
              time.sleep(3)  # Let the worker's existing parent-PID watchdog exit before restarting.
          screens = sorted(pathlib.Path(".build/preview/screens").glob("*.png"))
          print("Captured files:", [p.name for p in screens])
          assert len(screens) == 3, "GUI capture unavailable in this hosted macOS session"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NameGuard-screenshots
          path: .build/preview/screens/*.png
          if-no-files-found: warn
          retention-days: 7
