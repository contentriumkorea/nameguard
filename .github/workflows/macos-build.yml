name: NameGuard macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and run portable macOS checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export NAMEGUARD_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          bash build-desktop-release.sh
          bash build.sh
          swift test
          xcrun swiftc -sdk "$NAMEGUARD_SDK" Sources/NameGuard/Core.swift Tests/Smoke.swift -o .build/smoke-ci
          .build/smoke-ci
          xcrun swiftc -sdk "$NAMEGUARD_SDK" Sources/NameGuardMenu/MenuState.swift Tests/MenuSmoke.swift -o .build/menu-smoke
          .build/menu-smoke
          xcrun swiftc -sdk "$NAMEGUARD_SDK" Sources/NameGuard/Core.swift Sources/NameGuard/Watcher.swift Sources/NameGuardMenu/MenuState.swift Sources/NameGuardMenu/MenuSession.swift Tests/MenuLifecycle.swift -o .build/menu-lifecycle
          .build/menu-lifecycle "$PWD/.build/nameguard"
          python3 Tests/distribution.py
          python3 Tests/update-install.py
          xcrun swiftc -sdk "$NAMEGUARD_SDK" Sources/NameGuardMenu/AppServices.swift Tests/StartupSmoke.swift -o .build/startup-smoke
          .build/startup-smoke "$PWD/.build/nameguard"
          xcrun swiftc -sdk "$NAMEGUARD_SDK" Sources/NameGuardMenu/AppServices.swift Sources/NameGuardMenu/UpdateService.swift Tests/UpdateDownloadSmoke.swift -o .build/update-download-smoke
          python3 Tests/update-download.py
      - name: Save installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NameGuard-macOS
          path: dist/NameGuard-Desktop.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish a new version from main after all checks pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app-info.plist)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This version is already published: $version"
            exit 0
          fi
          cp dist/NameGuard-Desktop.zip dist/NameGuard.zip
          gh release create "$tag" dist/NameGuard.zip --target "$GITHUB_SHA" --title "NameGuard $version" --notes-file distribution/desktop/변경사항.md
