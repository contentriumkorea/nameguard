name: NameGuard macOS

on:
  workflow_dispatch:
  push:
    branches: [main, rust-migration]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust targets and dependency lock
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          test -f Cargo.lock || cargo generate-lockfile
          cargo fmt
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nameguard-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-${{ hashFiles('Sources/Rust/**') }}
          restore-keys: nameguard-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-
      - name: Check Rust core and build universal application
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          cargo test --locked -- --test-threads=1
          bash build.sh
          bash build-desktop-release.sh
      - name: Verify native behavior, settings migration and app updates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export NAMEGUARD_TEST_BINARY="$PWD/.build/nameguard"
          export NAMEGUARD_TEST_ZIP="$PWD/dist/NameGuard-Desktop.zip"
          cargo test --locked -- --test-threads=1
          python3 Tests/integration.py
          python3 Tests/distribution.py
          python3 Tests/update-install.py
          # Verify the unchanged 1.2.1 updater can validate the new Rust package.
          xcrun swiftc -sdk "$(xcrun --sdk macosx --show-sdk-path)" Sources/NameGuardMenu/AppServices.swift Sources/NameGuardMenu/UpdateService.swift Tests/UpdateDownloadSmoke.swift -o .build/update-download-smoke
          python3 Tests/update-download.py
      - name: Save installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NameGuard-macOS
          path: dist/NameGuard-Desktop.zip
          if-no-files-found: error
          retention-days: 14
      - name: Save reproducible Rust source and dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NameGuard-Rust-source
          path: |
            Cargo.lock
            Sources/Rust/*.rs
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Publish a new version from main after all checks pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app-info.plist)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This version is already published: $version"
            exit 0
          fi
          cp dist/NameGuard-Desktop.zip dist/NameGuard.zip
          gh release create "$tag" dist/NameGuard.zip --target "$GITHUB_SHA" --title "NameGuard $version" --notes-file distribution/desktop/변경사항.md
